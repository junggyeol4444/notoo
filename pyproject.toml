[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-factory"
version = "0.1.0"
description = "참고소설을 구조로 분석하고 그 구조로 장편소설을 쓰는 시스템"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
# PDF 파싱. 없어도 나머지 포맷은 전부 동작한다.
pdf = ["pypdf>=5.0"]
# PostgreSQL + pgvector로 옮길 때
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
# 표지·썸네일 JPEG 생성 (기획안 43번). EPUB 제작 자체는 표준 라이브러리로 한다.
publish = ["pillow>=10"]
dev = [
    "pytest>=8",
    "pillow>=10",
    # HWP 파서의 OLE 리더를 독립 구현과 대조하는 테스트에만 쓴다
    "olefile>=0.47",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
novel-factory = "novel_factory.cli:main"

[tool.setuptools.packages.find]
include = ["novel_factory*"]

[tool.setuptools.package-data]
# 관리자 화면 정적 파일
"novel_factory.app" = ["static/admin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001",  # 한글 문자열의 전각 문장부호를 모호 문자로 보는 검사
    "RUF002",
    "RUF003",
    "B008",    # FastAPI의 Depends() 기본값 패턴
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# 프롬프트 템플릿의 한국어 문장은 줄을 나누면 오히려 읽기 어렵다
"novel_factory/generation/prompts.py" = ["E501"]
# EPUB XML 템플릿. 태그를 줄 중간에서 나누면 틀을 알아보기 어렵다
"novel_factory/publishing/epub.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
